[profile.default]
solc = "0.8.30"
optimizer_runs = 200
via_ir = true
libs = ["lib"]
fs_permissions = [{ access = "read", path = "../circuits/target" }, { access = "read", path = "./test/fixtures" }]

[fmt]
single_line_statement_blocks = "multi"
multiline_func_header = "all"
override_spacing = false
bracket_spacing = true
int_types = "long"
number_underscore = "thousands"
