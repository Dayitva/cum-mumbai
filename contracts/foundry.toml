[profile.default]
solc = "0.8.30"
optimizer_runs = 1
via_ir = true
libs = ["lib"]
fs_permissions = [{ access = "write", path = "../circuits/fixtures" }, { access = "write", path = "../app/lib" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "./out" }]

[fmt]
single_line_statement_blocks = "multi"
multiline_func_header = "all"
override_spacing = false
bracket_spacing = true
int_types = "long"
number_underscore = "thousands"

# The generated verifier's assembly does not compile under via_ir.
[[profile.default.additional_compiler_profiles]]
name = "verifier"
via_ir = false
optimizer = true
optimizer_runs = 1

[[profile.default.compilation_restrictions]]
paths = "src/verifier/*"
via_ir = false

# Under via_ir the Poseidon library compiles past the 24KB contract size limit.
[[profile.default.compilation_restrictions]]
paths = "src/libs/pp/Poseidon.sol"
via_ir = false
